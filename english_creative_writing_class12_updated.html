<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S.K. Gupta Classes — Protected Content</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#05080f;color:#f0ede6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:32px 24px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.lock-icon{font-size:48px;margin-bottom:16px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.lock-title{font-size:22px;font-weight:700;margin-bottom:6px;background:linear-gradient(135deg,#d4a84b,#f0cb78);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lock-sub{font-size:12px;color:#8a8680;margin-bottom:24px}
.pw-wrap{position:relative;margin-bottom:14px}
.pw-wrap input{width:100%;padding:13px 44px 13px 16px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.12);border-radius:12px;color:#f0ede6;font-size:15px;outline:none;font-family:inherit;transition:border-color 0.2s;-webkit-text-fill-color:#f0ede6}
.pw-wrap input:focus{border-color:rgba(212,168,75,0.6);background:rgba(212,168,75,0.05)}
.pw-wrap input::placeholder{color:#5c5a56}
.eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:#5c5a56}
.unlock-btn{width:100%;padding:13px;background:linear-gradient(135deg,#d4a84b,#f0cb78);border:none;border-radius:12px;color:#1a1200;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s}
.unlock-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,168,75,0.4)}
.unlock-btn:disabled{opacity:0.6;transform:none;cursor:wait}
.err{background:rgba(255,77,109,0.12);border:1px solid rgba(255,77,109,0.3);color:#ff8fa3;border-radius:10px;padding:10px;font-size:13px;margin-bottom:14px;display:none}
.prog{margin-top:14px;font-size:12px;color:#8a8680;display:none}
.prog-bar{height:3px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:8px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#d4a84b,#f0cb78);border-radius:3px;width:0%;transition:width 0.3s}
.enroll-link{margin-top:16px;font-size:12px;color:#5c5a56}
.enroll-link a{color:#d4a84b;text-decoration:none}
</style>
</head>
<body>
<div class="lock-box">
  <div class="lock-icon">🔐</div>
  <div class="lock-title">S.K. Gupta Classes</div>
  <div class="lock-sub">Yeh content sirf enrolled students ke liye hai<br>Access karne ke liye apna password daalo</div>
  <div class="err" id="err">❌ Galat password. SK Gupta sir se apna password lein.</div>
  <div class="pw-wrap">
    <input type="password" id="pw" placeholder="Apna password daalo..." autocomplete="current-password">
    <button class="eye-btn" onclick="toggleEye()" id="eye-btn">👁</button>
  </div>
  <button class="unlock-btn" id="unlock-btn" onclick="unlock()">🔓 Content Unlock Karein</button>
  <div class="prog" id="prog">
    <span id="prog-txt">Password verify ho raha hai...</span>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
  </div>
  <div class="enroll-link">Enrolled nahi hain? <a href="login.html">Enroll karein →</a></div>
</div>

// Also check sessionStorage (from login.html flow)
(async function autoUnlock(){
  const saved = sessionStorage.getItem('skgc_pw');
  if(saved) {
    document.getElementById('pw').value = saved;
    await unlock(true);
  }
})();

function toggleEye(){
  const inp = document.getElementById('pw');
  const btn = document.getElementById('eye-btn');
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈';}
  else{inp.type='password';btn.textContent='👁';}
}

document.getElementById('pw').addEventListener('keydown', e=>{
  if(e.key==='Enter') unlock();
});

async function unlock(auto=false){
  const pw = document.getElementById('pw').value.trim();
  if(!pw){
    if(!auto){document.getElementById('err').style.display='block';document.getElementById('err').textContent='⚠️ Password daalo pehle!';}
    return;
  }
  
  document.getElementById('err').style.display='none';
  document.getElementById('unlock-btn').disabled=true;
  document.getElementById('prog').style.display='block';
  
  const steps = [
    ['Password verify ho rahi hai...', 20],
    ['Key generate ho rahi hai...', 50],
    ['Content decrypt ho raha hai...', 80],
    ['Almost ready...', 95]
  ];
  
  for(const [txt, pct] of steps){
    document.getElementById('prog-txt').textContent = txt;
    document.getElementById('prog-fill').style.width = pct+'%';
    await new Promise(r=>setTimeout(r, 300));
  }

  try {
    // Decode base64
    const salt = b64ToBytes(ENC.salt);
    const iv   = b64ToBytes(ENC.iv);
    const tag  = b64ToBytes(ENC.tag);
    const ct   = b64ToBytes(ENC.ct);
    
    // Derive key using PBKDF2
    const keyMaterial = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:salt, iterations:100000, hash:'SHA-256' },
      keyMaterial,
      { name:'AES-GCM', length:256 },
      false, ['decrypt']
    );
    
    // AES-GCM decrypt (tag appended to ciphertext for WebCrypto)
    const ctWithTag = new Uint8Array(ct.length + tag.length);
    ctWithTag.set(ct); ctWithTag.set(tag, ct.length);
    
    const decrypted = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:iv },
      key,
      ctWithTag
    );
    
    const html = new TextDecoder().decode(decrypted);
    
    // Save pw to sessionStorage for page reloads
    sessionStorage.setItem('skgc_pw', pw);
    
    document.getElementById('prog-fill').style.width='100%';
    document.getElementById('prog-txt').textContent='✓ Unlock ho gaya!';
    
    await new Promise(r=>setTimeout(r,400));
    
    // Replace entire document with decrypted content
    document.open(); document.write(html); document.close();
    
  } catch(e) {
    document.getElementById('unlock-btn').disabled=false;
    document.getElementById('prog').style.display='none';
    document.getElementById('err').style.display='block';
    document.getElementById('err').textContent='❌ Galat password. SK Gupta sir se apna password lein.';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}

function b64ToBytes(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}
